<?xml version="1.0" encoding="utf-8"?>
<Settings xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <Version>2</Version>
  <EnableBoosting>true</EnableBoosting>
  <EnableGridGroups>true</EnableGridGroups>
  <IgnoreGridsWithoutThrust>true</IgnoreGridsWithoutThrust>
  <IgnoreGridsWithoutCockpit>false</IgnoreGridsWithoutCockpit>
  <ParachuteDeployHeight>400</ParachuteDeployHeight>
  <SpeedLimit>1500</SpeedLimit>
  <RemoteControlSpeedLimit>1000</RemoteControlSpeedLimit>
  <LargeGrid>
    <CruiseCurve>
      <Point Mass="200000" Speed="1200" />
      <Point Mass="5000000" Speed="850" />
      <Point Mass="8000000" Speed="650" />
    </CruiseCurve>
    <MaxBoostSpeed>1500</MaxBoostSpeed>
    <ResistanceMultiplier>1.5</ResistanceMultiplier>
  </LargeGrid>
  <SmallGrid>
    <CruiseCurve>
      <Point Mass="10000" Speed="1200" />
      <Point Mass="300000" Speed="1000" />
      <Point Mass="400000" Speed="950" />
    </CruiseCurve>
    <MaxBoostSpeed>1500</MaxBoostSpeed>
    <ResistanceMultiplier>1</ResistanceMultiplier>
  </SmallGrid>
</Settings>
